const c=document.querySelector('canvas'),g=c.getContext('2d'),menu=document.querySelector('#menu'),keys={}, W=960,H=540,ground=400;let p,e,shots=[],sparks=[],stage=0,active=false,last=0,clock=0,shake=0;const names=['Ryujin','Vesper','Kael','Nyx','Emperor Sol'],colors=['#67518b','#376f78','#873d53','#42456e','#aa7940'];function fighter(x,enemy){return{x,y:ground,vy:0,hp:100,ki:50,dir:enemy?-1:1,enemy,cd:0,pose:0,power:0,flash:0,guard:false}}function round(){victory=null;document.querySelector("#controls").style.visibility="visible";menu.classList.remove("champion");p=fighter(230,false);e=fighter(730,true);shots=[];sparks=[];clock=0;active=true;menu.style.display='none'}document.querySelector('#start').onclick=()=>{stage=0;round()};let victory=null,audio;function soundReady(){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();audio.resume()}catch(e){}}document.addEventListener('pointerdown',soundReady,{once:true});function fanfare(final){if(!audio)return;try{let notes=final?[261.63,329.63,392,523.25,392,523.25,659.25,783.99]:[392,523.25,659.25,783.99];notes.forEach((f,i)=>{let o=audio.createOscillator(),v=audio.createGain(),t=audio.currentTime+i*.19;o.type='triangle';o.frequency.value=f;v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(.10,t+.04);v.gain.exponentialRampToValueAtTime(.001,t+.45);o.connect(v);v.connect(audio.destination);o.start(t);o.stop(t+.46)})}catch(e){}}function result(win){menu.style.display='grid';menu.classList.toggle('champion',win&&stage===4);menu.innerHTML=`<h1>${win?(stage===4?'LEGENDARY SPIRIT WARRIOR':'VICTORY!'):'DEFEATED'}</h1><p>${win?(stage===4?'★ CHAMPION ★<br>Five rivals defeated. Your legend begins.':names[stage]+' defeated. Your spirit grows stronger!'):'Try guarding and charging your energy.'}</p><button id=again>${win&&stage<4?'NEXT RIVAL':'PLAY AGAIN'}</button>`;document.querySelector('#again').onclick=()=>{stage=win&&stage<4?stage+1:0;round()}}function end(win){active=false;Object.keys(keys).forEach(
